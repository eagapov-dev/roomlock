# Single source of versions for the whole build (rule ST-3).
# Libraries without a version are managed by the Spring Boot BOM.

[versions]
java = "21"
spring-boot = "3.5.16"
spring-dependency-management = "1.1.7"
spotless = "8.10.3"
google-java-format = "1.36.1"
jib = "3.5.4"
protobuf-plugin = "0.10.0"
protobuf = "4.36.2"
grpc = "1.84.0"
gatling-plugin = "3.15.1.3"

[libraries]
# Gradle plugins: all of them live on the build-logic classpath, modules apply them by id
# without a version (one plugin classloader for the whole build).
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spring-dependency-management-gradle-plugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "spring-dependency-management" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
jib-gradle-plugin = { module = "com.google.cloud.tools:jib-gradle-plugin", version.ref = "jib" }
protobuf-gradle-plugin = { module = "com.google.protobuf:protobuf-gradle-plugin", version.ref = "protobuf-plugin" }
gatling-gradle-plugin = { module = "gradle.plugin.io.gatling.gradle:gatling-gradle-plugin", version.ref = "gatling-plugin" }

# Platforms
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }

# Spring (versions from the Spring Boot BOM)
spring-core = { module = "org.springframework:spring-core" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }

# Persistence (versions from the Spring Boot BOM)
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }

# Protobuf and gRPC
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protobuf-protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-protoc-gen-java = { module = "io.grpc:protoc-gen-grpc-java", version.ref = "grpc" }

# Tests (versions from the Spring Boot BOM)
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
awaitility = { module = "org.awaitility:awaitility" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
