# Local stack: Postgres (booking, payment, notification), Kafka (KRaft), Keycloak, Prometheus,
# Grafana and the three services (Jib images roomlock/<service>:dev).
#
#   ./gradlew jibDockerBuild
#   docker compose -f infra/docker-compose.yml up -d
#
# Infrastructure only (services from the IDE):
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.ide.yml up -d
#
# Host ports and local credentials: infra/.env.example (defaults below are the same values).
name: roomlock

x-service-defaults: &service-defaults
  restart: unless-stopped
  environment: &service-env
    SPRING_DATASOURCE_USERNAME: ${ROOMLOCK_DB_USER:-roomlock}
    SPRING_DATASOURCE_PASSWORD: ${ROOMLOCK_DB_PASSWORD:-roomlock}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      ROOMLOCK_DB_USER: ${ROOMLOCK_DB_USER:-roomlock}
      ROOMLOCK_DB_PASSWORD: ${ROOMLOCK_DB_PASSWORD:-roomlock}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # TCP, not the socket: during init the entrypoint runs a socket-only temporary server,
      # so this turns healthy only after the init script has created the databases.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "booking"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL: containers in this network (kafka:9092); EXTERNAL: host / IDE (localhost:KAFKA_PORT).
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "${KAFKA_PORT:-9094}:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  # The identity provider of a local run: booking-service validates the guest's access token against
  # this realm (README.md shows the two commands that get one). Local convenience only - nothing in
  # infra/gcp runs it, and a deployment brings its own provider (docs/deployment.md).
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.1
    # start-dev: no TLS, no production hostname checks, the realm imported on every start. A
    # development mode is the whole point here; it is also why this must not leave a laptop.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # The one URL every token is minted for, whoever asked. Without it Keycloak derives the issuer
      # from the request, so a token fetched from the host would carry localhost and one fetched from
      # a container would carry keycloak:8080 - and booking-service, which validates a single `iss`,
      # would refuse one of the two. It pins the frontend URL; the keys are fetched from
      # keycloak:8080 below, which is a different address for the same realm on purpose.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8088}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8088}:8080"
    volumes:
      - ./keycloak/roomlock-realm.json:/opt/keycloak/data/import/roomlock-realm.json:ro
    healthcheck:
      # The image carries neither curl nor wget, and readiness lives on the management port 9000,
      # so this asks over bash's own TCP redirection - the one thing the container definitely has.
      # The endpoint answers 200 once the realm is imported and 503 before that, which is the test.
      test:
        - CMD-SHELL
        - exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q 200
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # Lets the IDE override scrape services on the host (also on Linux).
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 12

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  booking-service:
    <<: *service-defaults
    image: roomlock/booking-service:dev
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/booking
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # The payment contract is served on gRPC inside this network; the default of application.yml
      # is the localhost of an IDE run.
      SPRING_GRPC_CLIENT_CHANNELS_PAYMENT_ADDRESS: static://payment-service:9091
      # roomlock.locking.strategy (Spring relaxed binding): pessimistic, optimistic or constraint.
      # The default is the one of application.yml, so the stack behaves as before without it, and
      # comparing the three strategies here is a variable rather than a run outside the stack (D2).
      ROOMLOCK_LOCKING_STRATEGY: ${ROOMLOCK_LOCKING_STRATEGY:-constraint}
      # Two addresses for the same Keycloak, and both are needed. The keys are fetched from inside
      # this network, where localhost is the container itself; the `iss` claim of a token is the
      # frontend URL Keycloak was pinned to above, which is what a developer on the host asks. The
      # defaults of application.yml are the host side of both, for a run from the IDE.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/roomlock/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-8088}/realms/roomlock
    ports:
      - "${BOOKING_PORT:-8090}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      # Not strictly required to start - the JWK set is fetched on the first request that carries a
      # token, not at startup - but a stack that is up should be a stack that can be called.
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  payment-service:
    <<: *service-defaults
    image: roomlock/payment-service:dev
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "${PAYMENT_PORT:-8091}:8081"
      # The payment contract is served on gRPC, next to the HTTP port: booking-service reaches it
      # inside this network as payment-service:9091, this mapping is for grpcurl from the host.
      - "${PAYMENT_GRPC_PORT:-9091}:9091"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  notification-service:
    <<: *service-defaults
    image: roomlock/notification-service:dev
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "${NOTIFICATION_PORT:-8092}:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  postgres-data:
  kafka-data:
  prometheus-data:
  grafana-data:
