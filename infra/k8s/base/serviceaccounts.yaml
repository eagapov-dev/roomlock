# One identity per service, mirroring the three service accounts of infra/gcp/iam.tf.
#
# In the Cloud Run shape the identity *is* the authorisation: payment-service has a single
# run.invoker binding for booking-service's account and notification-service has none at all. Here
# it carries none, because Kubernetes RBAC governs the API server and not traffic between pods - the
# traffic statement lives in network-policies.yaml instead. The accounts still earn their place:
# they are what an RBAC rule, an audit log line or a Workload Identity binding would attach to, and
# they stop all three services from sharing the namespace's `default` account.
#
# automountServiceAccountToken: false on all three - none of them calls the Kubernetes API, so a
# mounted token would be a credential sitting in a container with no use for it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: booking-service
  labels:
    app.kubernetes.io/name: booking-service
    app.kubernetes.io/part-of: roomlock
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-service
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: roomlock
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-service
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: roomlock
automountServiceAccountToken: false
