# Kafka 3.9.1 in KRaft mode: one broker that is also the controller, three default partitions, the
# same image and the same settings as infra/docker-compose.yml.
#
# THIS IS NOT HOW TO RUN KAFKA EITHER. One broker means replication factor 1 on every topic, so the
# durability the contract assumes (`acks: all` in booking-service's producer) is satisfied by a
# single disk. A real cluster gets Strimzi or a managed service - infra/gcp/kafka.tf buys the latter.
# A single broker is here so the topology is complete, not because it is defensible.
#
# The Service is headless, and here that is load-bearing rather than tidy. A Kafka client bootstraps
# against any address, then reconnects to whatever the broker *advertises*. With a ClusterIP the
# advertised address would have to be that VIP, and every connection would be balanced onto a random
# broker instead of the partition leader - wrong the moment there is more than one. Headless gives
# each pod a stable DNS name (kafka-0.kafka.<namespace>.svc.cluster.local) to advertise, which is
# what the metadata response needs to be truthful. `kafka:9092` still resolves for bootstrapping.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: roomlock
spec:
  clusterIP: None
  # Answer DNS for a pod that is not ready yet: a broker forming its quorum has to be able to
  # resolve itself and its peers before it is serving clients.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: client
      port: 9092
      targetPort: client
    - name: controller
      port: 9093
      targetPort: controller
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: roomlock
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/part-of: roomlock
    spec:
      automountServiceAccountToken: false
      securityContext:
        # uid 1000 is `appuser` of the apache/kafka image. runAsGroup is deliberately not set, so the
        # image's own primary group stays in effect; fsGroup is what gets the data volume written.
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka
          image: apache/kafka:3.9.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # The entrypoint of this image writes its rendered server.properties under /etc/kafka,
            # so the root filesystem cannot be read-only without mapping that path out as well.
            readOnlyRootFilesystem: false
          ports:
            - name: client
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            # The pod's own name, so the advertised listener can name it. Kubernetes expands $(VAR)
            # in later env values from earlier ones in the same container, which is the only way a
            # plain StatefulSet can build a per-pod address.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@$(POD_NAME).kafka.$(POD_NAMESPACE).svc.cluster.local:9093
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            # One listener for clients and one for the controller quorum. The compose stack has a
            # third (EXTERNAL) so an IDE on the host can reach the broker; there is no equivalent
            # here, because the only way in from a laptop is `kubectl port-forward`, and a broker
            # cannot advertise an address that is only true inside the forwarding process. Reading
            # topics from outside is `kubectl exec` into this pod (see infra/k8s/README.md).
            - name: KAFKA_LISTENERS
              value: INTERNAL://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: INTERNAL://$(POD_NAME).kafka.$(POD_NAMESPACE).svc.cluster.local:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: INTERNAL
            # One broker, so nothing can be replicated further than that. Stating it rather than
            # letting the defaults (3) fail to create the internal topics.
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            # Three partitions per topic, matching the local broker. This is the number that caps
            # consumer parallelism - see the replica counts in pod-disruption-budgets.yaml and the
            # note on each consumer Deployment.
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            # KRaft needs a cluster id before it can format its storage, and the image generates a
            # random one when this is unset - so a rebuilt volume would silently become a different
            # cluster. Pinned instead, which makes the formatting reproducible. An identifier, not a
            # credential. The shape is not free: KRaft parses it as a base64url-encoded UUID, so it
            # has to be exactly 22 characters of that alphabet, which is why it reads the way it does.
            - name: CLUSTER_ID
              value: roomlock-kraft-clusteA
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          # The compose stack uses `kafka-topics.sh --list` as its healthcheck, which is the right
          # check - it proves the broker answers a metadata request, not merely that a port is open.
          # It also starts a JVM, so it belongs in a startup probe that runs a bounded number of
          # times rather than in a liveness loop for the life of the pod.
          startupProbe:
            exec:
              command:
                - /opt/kafka/bin/kafka-topics.sh
                - --bootstrap-server
                - localhost:9092
                - --list
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 18
          readinessProbe:
            tcpSocket:
              port: client
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: client
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 640Mi
            limits:
              cpu: "1"
              memory: 1536Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 4Gi
