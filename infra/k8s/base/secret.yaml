# The database credentials, and the only Secret in this deployment.
#
# THE VALUES BELOW ARE PLACEHOLDERS. They are the throwaway credentials of the local stack
# (infra/.env.example), kept identical so a reader comparing the three shapes sees the same
# password in all three - and for no other reason. Nothing here is a credential of anything that
# exists.
#
# Where a real one comes from: not from this file. A cluster that matters keeps the password in a
# secret manager and projects it in, which is a component and not a manifest - External Secrets
# Operator with a `SecretStore`, or the Secrets Store CSI driver mounting it at pod start. The
# Cloud Run shape shows the same idea with the platform doing the work: infra/gcp/secrets.tf
# creates the Secret Manager secret and run.tf resolves it into the revision's environment, so the
# value never appears in `gcloud run services describe`. Here it *does* appear in
# `kubectl get secret -o yaml`, base64 is an encoding and not encryption, and that is exactly why
# a placeholder is all this file may hold.
#
# stringData rather than data: the point of this file is to be read, and base64 would hide the fact
# that it is a placeholder. The API server stores it base64-encoded either way.
apiVersion: v1
kind: Secret
metadata:
  name: roomlock-db
  labels:
    app.kubernetes.io/part-of: roomlock
type: Opaque
stringData:
  # PostgreSQL superuser, used by the init script of the StatefulSet and by nothing else.
  superuser-password: postgres
  # The application role the three services connect as - one role, three databases, as in the
  # compose stack.
  app-password: roomlock
