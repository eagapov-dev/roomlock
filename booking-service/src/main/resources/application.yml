spring:
  application:
    name: booking-service
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  datasource:
    hikari:
      maximum-pool-size: 10

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
