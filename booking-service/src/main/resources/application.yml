spring:
  application:
    name: booking-service
  threads:
    virtual:
      enabled: true
  flyway:
    locations: classpath:db/migration, classpath:db/constraint
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    # Local run against the EXTERNAL listener of infra/docker-compose; the container overrides
    # SPRING_KAFKA_BOOTSTRAP_SERVERS with kafka:9092 (INTERNAL).
    bootstrap-servers: localhost:9094
    producer:
      # The outbox may only mark a row published once every replica has the record.
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  datasource:
    # Local run against infra/docker-compose (host port 5433); the container overrides SPRING_DATASOURCE_*.
    url: jdbc:postgresql://localhost:5433/booking
    username: roomlock
    password: roomlock
    hikari:
      maximum-pool-size: 10
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak of infra/docker-compose.yml, imported from infra/keycloak/roomlock-realm.json.
          # It is a local convenience only: nothing in infra/gcp or a Kubernetes manifest runs it, and
          # a real deployment points these two at its own provider (docs/deployment.md).
          #
          # Both values, not just one. The keys are fetched from where this process can actually reach
          # the provider, while the `iss` claim is validated against the URL the *token* was minted
          # for - and inside compose those are two different addresses for the same Keycloak
          # (`keycloak:8080` from a container, `localhost:8088` from the host). Setting only
          # jwk-set-uri would leave `iss` unchecked, and setting only issuer-uri would make a
          # container fetch the keys through a host port it cannot see.
          issuer-uri: http://localhost:8088/realms/roomlock
          jwk-set-uri: http://localhost:8088/realms/roomlock/protocol/openid-connect/certs
  grpc:
    client:
      channels:
        # The roomlock.payment.v1.PaymentService contract of payment-api. Local run against the host
        # port of infra/docker-compose (9091); inside that network payment-service serves it as
        # payment-service:9091, which the container sets through
        # SPRING_GRPC_CLIENT_CHANNELS_PAYMENT_ADDRESS.
        payment:
          address: static://localhost:9091
          # Nothing between the two services terminates TLS, and the gRPC port of payment-service is
          # plaintext.
          negotiation-type: plaintext

# Booking rules of the service.
roomlock:
  money:
    # The currency every price of this deployment is in; booking rows carry no currency. Both the
    # events of the contract and the charge sent to payment-service carry it.
    currency: PLN
  outbox:
    # A sweep publishes what the outbox holds; ISO-8601, as @Scheduled parses it.
    interval: PT1S
    # Events one sweep publishes at most.
    batch-size: 100
    # Refusals after which an event is reported as stuck rather than as a passing outage.
    stuck-after: 10
    # How long one instance owns the right to publish. It renews on every sweep, so this only has to
    # outlast a sweep; a dead instance costs one lease period before another takes over.
    lease: PT30S
    retention:
      # Housekeeping, not a hot path.
      interval: PT1H
      # Published events stay this long, so yesterday's incident can still be read out of the table.
      older-than: P7D
      # Rows one prune deletes at most.
      batch-size: 1000
  payment:
    # A charge that takes longer than this is given up on; the booking stays PAYING and the sweep
    # below finishes it.
    deadline: 3s
    reconcile:
      # Delay between two sweeps over bookings whose charge never came back; ISO-8601, @Scheduled
      # reads it too.
      interval: PT10S
      # How long a booking may stay PAYING before a sweep asks the provider again. Well past the
      # deadline above, so a sweep never races a request that is still waiting for an answer.
      after: 1m
      # Bookings one sweep charges at most.
      batch-size: 100
  hold:
    # A HELD booking keeps the room for this long before it may expire.
    ttl: 10m
    expiry:
      # Delay between two sweeps that cancel expired holds; ISO-8601, @Scheduled reads it too.
      interval: PT30S
      # Holds one sweep cancels at most.
      batch-size: 500
  locking:
    # pessimistic | optimistic | constraint (D2)
    strategy: constraint
    optimistic:
      # Attempts of one hold; 1 disables retrying. Only the optimistic strategy retries a lost
      # race, hence the prefix: the other two try once, and a conflict costs them waiting or a
      # busy answer instead.
      max-attempts: 3

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus

---
# Correctness of the locking strategies is tested without the exclusion constraint (D1).
spring:
  config:
    activate:
      on-profile: no-constraint
  flyway:
    locations: classpath:db/migration

---
# Cloud Run deployment (rule SP-9): Cloud SQL over private IP, Google Managed Service for Apache
# Kafka, payment-service behind Cloud Run authentication. Every address and every credential of a
# real project comes from the environment - nothing below is a literal of one - and docs/deployment.md
# lists the variables and where each is set.
spring:
  config:
    activate:
      on-profile: cloud
  datasource:
    # Direct VPC egress puts the private IP of the Cloud SQL instance on a route of the revision, so
    # this is an ordinary host/port JDBC URL: no socket factory, no proxy sidecar, no public IP. A
    # whole URL in SPRING_DATASOURCE_URL still wins over it, the way the compose stack overrides the
    # local default above.
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    # A Secret Manager secret the revision reads as an environment variable; never a literal here.
    password: ${DB_PASSWORD}
    hikari:
      # Per instance, and Cloud Run runs many of them: max-instances x this, plus the pools of the
      # other two services, has to stay under the connection limit of the Cloud SQL tier - which is
      # why it is smaller than the 10 of a local run.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      # A request that cannot get a connection is answered rather than waiting for the Cloud Run
      # request timeout.
      connection-timeout: 5s
      # Cloud SQL maintenance moves the primary: a pool that retires connections notices the move
      # once instead of handing out a wall of broken ones.
      max-lifetime: 30m
  flyway:
    # Migrations keep running at startup. Flyway locks its history table before it migrates, so of
    # several instances starting at once exactly one migrates and the rest wait and then find nothing
    # to do - that lock, not luck, is what makes this safe during a rollout.
    #
    # What would change the answer: a migration the previous revision cannot survive (a dropped or
    # renamed column - both revisions serve traffic while Cloud Run shifts it), or one slow enough to
    # run into the startup probe and be killed halfway. Either one means migrating in a deliberate
    # step before the deploy instead of on startup.
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    security:
      # Managed Service for Apache Kafka accepts nothing else.
      protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
    properties:
      # The broker authenticates the service account of the revision over SASL/OAUTHBEARER: the
      # callback handler asks the metadata server for a token and refreshes it, so there is no
      # password to leak. The class ships in managed-kafka-auth-login-handler, a runtime dependency
      # of this service; a deployment that authenticates differently overrides the three variables.
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:OAUTHBEARER}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required;}
      sasl.login.callback.handler.class: ${KAFKA_SASL_LOGIN_CALLBACK_HANDLER_CLASS:com.google.cloud.hosted.kafka.auth.GcpLoginCallbackHandler}
      # The broker is milliseconds away but behind a VPC, a TLS handshake and a token: bound every
      # call, and reconnect with backoff rather than hammering a broker that is being moved.
      request.timeout.ms: 10000
      retry.backoff.ms: 500
      reconnect.backoff.max.ms: 10000
    producer:
      properties:
        # The outbox sweep waits 30s for an acknowledgement (KafkaEventSender), so the producer has
        # to give up first: a broker that is gone then shows up as a failed send whose row the next
        # sweep publishes again, not as a sweep that ran out of time.
        delivery.timeout.ms: 20000
        # Waiting for metadata of a topic is part of that budget, not on top of it.
        max.block.ms: 10000
  grpc:
    client:
      channels:
        payment:
          # The URL of the payment-service revision as a gRPC target on 443, for example
          # dns:///payment-service-<hash>-<region>.a.run.app:443.
          address: ${PAYMENT_GRPC_ADDRESS}
          # Cloud Run terminates TLS at the edge: the hop is https, and the plaintext default of the
          # local run must not reach this profile.
          negotiation-type: tls
  security:
    oauth2:
      resourceserver:
        jwt:
          # Which identity provider this deployment trusts. Neither value has a default, the way
          # DB_PASSWORD and PAYMENT_AUDIENCE have none: an issuer is not something to guess, and a
          # wrong default would be a service quietly accepting tokens of somebody else's provider.
          #
          # Both have to be named here, and not only because the local document above names both:
          # the documents of this file are merged, so a cloud revision that left jwk-set-uri alone
          # would inherit the localhost:8088 of a developer's Keycloak and fetch its keys from
          # nowhere. Overriding it is what keeps the local convenience local.
          #
          # Two variables rather than one and OIDC discovery, because the address the keys are
          # fetched from is a deployment's own business - it may be an internal one - and because a
          # value that is spelled out cannot be a surprise. Neither is read before the first request
          # that carries a token, so an unreachable issuer delays 401s and not the rollout
          # (docs/runbook.md).
          issuer-uri: ${OIDC_ISSUER_URI}
          jwk-set-uri: ${OIDC_JWK_SET_URI}
  lifecycle:
    # Cloud Run sends SIGTERM and then waits: let the in-flight requests and the running sweep
    # finish first.
    timeout-per-shutdown-phase: 20s

roomlock:
  cloud:
    # Audience of the ID token every Charge carries: the base URL of the payment-service revision,
    # which is what Cloud Run validates the token against (CloudRunAuthInterceptor).
    payment-audience: ${PAYMENT_AUDIENCE}

# The three sweeps - outbox, hold expiry, payment reconciliation - stay on: they are off only under
# the `test` profile (SchedulingConfig), and they are what finishes a hold, a charge or an outbox row
# after a crash. Nothing about them differs here, but they are @Scheduled rather than request-driven,
# so the revision has to keep its CPU between requests: CPU always allocated and at least one
# instance (docs/deployment.md). Several instances are safe, by two different mechanisms: hold expiry
# and payment reconciliation claim their batches with FOR UPDATE SKIP LOCKED, while the outbox takes a
# lease (PublisherLease) so one instance publishes at a time and the events of a booking keep order.
server:
  # Cloud Run says which port to listen on; the port of a local run stays the fallback.
  port: ${PORT:8080}
  # A revision being replaced stops taking requests before it stops serving the ones it has.
  shutdown: graceful

management:
  endpoint:
    health:
      probes:
        # /actuator/health/liveness and /actuator/health/readiness: Cloud Run is not Kubernetes, so
        # the groups are not enabled for us. The liveness probe reads the liveness group only, which
        # is what keeps a database that is briefly away from restarting the instance.
        enabled: true
  # The exposure list of the default document already publishes health and prometheus and nothing
  # else: /actuator/health for the startup and liveness probes of the revision, /actuator/prometheus
  # for the Google Managed Prometheus sidecar that scrapes it. Both stay reachable without a token
  # (ApiSecurityConfig): neither a Cloud Run probe nor the collector sidecar can present one.
