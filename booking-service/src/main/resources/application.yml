spring:
  application:
    name: booking-service
  threads:
    virtual:
      enabled: true
  flyway:
    locations: classpath:db/migration, classpath:db/constraint
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    # Local run against the EXTERNAL listener of infra/docker-compose; the container overrides
    # SPRING_KAFKA_BOOTSTRAP_SERVERS with kafka:9092 (INTERNAL).
    bootstrap-servers: localhost:9094
    producer:
      # The outbox may only mark a row published once every replica has the record.
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  datasource:
    # Local run against infra/docker-compose (host port 5433); the container overrides SPRING_DATASOURCE_*.
    url: jdbc:postgresql://localhost:5433/booking
    username: roomlock
    password: roomlock
    hikari:
      maximum-pool-size: 10
  grpc:
    client:
      channels:
        # The roomlock.payment.v1.PaymentService contract of payment-api. Local run against the host
        # port of infra/docker-compose (9091); inside that network payment-service serves it as
        # payment-service:9091, which the container sets through
        # SPRING_GRPC_CLIENT_CHANNELS_PAYMENT_ADDRESS.
        payment:
          address: static://localhost:9091
          # Nothing between the two services terminates TLS, and the gRPC port of payment-service is
          # plaintext.
          negotiation-type: plaintext

# Booking rules of the service.
roomlock:
  money:
    # The currency every price of this deployment is in; booking rows carry no currency. Both the
    # events of the contract and the charge sent to payment-service carry it.
    currency: PLN
  outbox:
    # A sweep publishes what the outbox holds; ISO-8601, as @Scheduled parses it.
    interval: PT1S
    # Events one sweep publishes at most.
    batch-size: 100
  payment:
    # A charge that takes longer than this is given up on; the booking stays PAYING and the sweep
    # below finishes it.
    deadline: 3s
    reconcile:
      # Delay between two sweeps over bookings whose charge never came back; ISO-8601, @Scheduled
      # reads it too.
      interval: PT10S
      # How long a booking may stay PAYING before a sweep asks the provider again. Well past the
      # deadline above, so a sweep never races a request that is still waiting for an answer.
      after: 1m
      # Bookings one sweep charges at most.
      batch-size: 100
  hold:
    # A HELD booking keeps the room for this long before it may expire.
    ttl: 10m
    expiry:
      # Delay between two sweeps that cancel expired holds; ISO-8601, @Scheduled reads it too.
      interval: PT30S
      # Holds one sweep cancels at most.
      batch-size: 500
  locking:
    # pessimistic | optimistic | constraint (D2)
    strategy: constraint
    # Attempts of a strategy that retries a lost race (optimistic).
    max-attempts: 3

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus

---
# Correctness of the locking strategies is tested without the exclusion constraint (D1).
spring:
  config:
    activate:
      on-profile: no-constraint
  flyway:
    locations: classpath:db/migration
