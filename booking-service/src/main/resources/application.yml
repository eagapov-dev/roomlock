spring:
  application:
    name: booking-service
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  datasource:
    # Local run against infra/docker-compose (host port 5433); the container overrides SPRING_DATASOURCE_*.
    url: jdbc:postgresql://localhost:5433/booking
    username: roomlock
    password: roomlock
    hikari:
      maximum-pool-size: 10

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
