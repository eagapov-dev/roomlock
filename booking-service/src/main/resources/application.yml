spring:
  application:
    name: booking-service
  threads:
    virtual:
      enabled: true
  flyway:
    locations: classpath:db/migration, classpath:db/constraint
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  datasource:
    # Local run against infra/docker-compose (host port 5433); the container overrides SPRING_DATASOURCE_*.
    url: jdbc:postgresql://localhost:5433/booking
    username: roomlock
    password: roomlock
    hikari:
      maximum-pool-size: 10

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus

---
# Correctness of the locking strategies is tested without the exclusion constraint (D1).
spring:
  config:
    activate:
      on-profile: no-constraint
  flyway:
    locations: classpath:db/migration
