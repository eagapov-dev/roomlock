# Load tests are never part of the regular CI run: they are slow and shared runners
# give noisy numbers. Started manually only, one run per locking strategy.
name: Load tests

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: Locking strategy the service under test runs with
        type: choice
        default: constraint
        options:
          - constraint
          - optimistic
          - pessimistic
      simulations:
        description: Simulations of this run (holds = the three hold scenarios, payments = the three confirm-flow ones)
        type: choice
        default: all
        options:
          - all
          - holds
          - payments
          - contention
          - throughput
          - idempotent-retry
          - confirm-flow
          - decline-flow
          - idempotent-pay
      payment_mode:
        description: Decision mode of the payment provider; DECLINE_ALL declines every charge
        type: choice
        default: THRESHOLD
        options:
          - THRESHOLD
          - APPROVE_ALL
          - DECLINE_ALL
      users:
        description: Virtual users of the load phase
        type: number
        default: 50
      duration:
        description: Seconds the throughput and confirm-flow scenarios keep their users busy
        type: number
        default: 30

permissions:
  contents: read

concurrency:
  # Two runs would fight over the same ports and the same database.
  group: load-tests
  cancel-in-progress: false

jobs:
  load-tests:
    name: Gatling load tests (${{ inputs.strategy }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The Gradle toolchain requires Java 21 and auto-provisioning is disabled.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Gradle cache + wrapper checksum validation.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The compose file of a local run, and its healthchecks, but only the infrastructure:
      # the services run next to the stack so every run can pick its own strategy and its own
      # payment decision mode. Kafka is part of it because the outbox publishes to it.
      - name: Start PostgreSQL and Kafka
        run: docker compose -f infra/docker-compose.yml up -d --wait postgres kafka

      - name: Build the services under test
        run: ./gradlew :booking-service:bootJar :payment-service:bootJar

      # The confirm flow charges over gRPC, so the provider has to answer: roomlock.payment.decision.*
      # as environment variables (Spring relaxed binding), the rest of the defaults of its
      # application.yml already point at the host ports of the compose stack.
      - name: Start payment-service
        env:
          ROOMLOCK_PAYMENT_DECISION_MODE: ${{ inputs.payment_mode }}
        run: |
          java -jar payment-service/build/libs/payment-service.jar > payment-service.log 2>&1 &
          echo "$!" > payment-service.pid
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8081/actuator/health > /dev/null; then
              echo "payment-service is up"
              exit 0
            fi
            sleep 2
          done
          echo "payment-service did not become healthy in time"
          cat payment-service.log
          exit 1

      # roomlock.locking.strategy as an environment variable (Spring relaxed binding);
      # the datasource defaults of application.yml already point at the compose port 5433, and it
      # reaches the provider the way a run from the IDE does: on the local gRPC port 9091 above.
      - name: Start booking-service
        env:
          ROOMLOCK_LOCKING_STRATEGY: ${{ inputs.strategy }}
        run: |
          java -jar booking-service/build/libs/booking-service.jar > booking-service.log 2>&1 &
          echo "$!" > booking-service.pid
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then
              echo "booking-service is up"
              exit 0
            fi
            sleep 2
          done
          echo "booking-service did not become healthy in time"
          cat booking-service.log
          exit 1

      # The selected simulations, sequentially; --all is required because the plugin runs
      # non-interactively on a runner, and a single scenario is picked by its class instead.
      # An unexpected status fails the task here; the expected 409s do not.
      - name: Run Gatling simulations
        env:
          SIMULATIONS: ${{ inputs.simulations }}
          STRATEGY: ${{ inputs.strategy }}
          PAYMENT_MODE: ${{ inputs.payment_mode }}
          USERS: ${{ inputs.users }}
          DURATION: ${{ inputs.duration }}
        run: |
          case "$SIMULATIONS" in
            all) selected="" ;;
            holds) selected="Contention Throughput IdempotentRetry" ;;
            payments) selected="ConfirmFlow DeclineFlow IdempotentPay" ;;
            contention) selected="Contention" ;;
            throughput) selected="Throughput" ;;
            idempotent-retry) selected="IdempotentRetry" ;;
            confirm-flow) selected="ConfirmFlow" ;;
            decline-flow) selected="DeclineFlow" ;;
            idempotent-pay) selected="IdempotentPay" ;;
            *) echo "unknown simulation selection: $SIMULATIONS"; exit 1 ;;
          esac

          run_gatling() {
            ./gradlew :load-tests:gatlingRun "$1" \
              --run-description "strategy=$STRATEGY, payment=$PAYMENT_MODE, users=$USERS, duration=${DURATION}s" \
              "-Droomlock.baseUrl=http://localhost:8080" \
              "-Droomlock.strategy=$STRATEGY" \
              "-Droomlock.paymentMode=$PAYMENT_MODE" \
              "-Droomlock.users=$USERS" \
              "-Droomlock.duration=$DURATION"
          }

          if [ -z "$selected" ]; then
            run_gatling --all
          else
            for simulation in $selected; do
              run_gatling "--simulation=dev.roomlock.loadtest.${simulation}Simulation"
            done
          fi

      - name: Stop the services
        if: always()
        run: |
          for service in booking-service payment-service; do
            if [ -f "$service.pid" ]; then
              kill "$(cat "$service.pid")" || true
            fi
          done

      # The HTML report of every simulation of this run.
      - name: Upload Gatling reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gatling-reports-${{ inputs.strategy }}
          path: load-tests/build/reports/gatling/
          if-no-files-found: error
          retention-days: 14

      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: service-logs-${{ inputs.strategy }}
          path: |
            booking-service.log
            payment-service.log
          if-no-files-found: ignore
          retention-days: 14
